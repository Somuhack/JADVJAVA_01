
# Logging
logging.level.root=INFO
logging.level.com.example.usersm=DEBUG
logging.level.org.springframework.web=DEBUG
logging.file.name=logs/application_dev.log
logging.level.org.flywaydb=DEBUG
# Database
spring.datasource.url=jdbc:mysql://localhost:3306/usersm?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Server
server.port=8080

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


management.endpoints.web.exposure.include=*
# File Upload
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false
logging.level.org.springframework.cache=TRACE
logging.level.org.springframework.data.redis=DEBUG
logging.level.org.springframework.cache.interceptor=TRACE
logging.level.org.springframework.data.redis.core=TRACE
logging.pattern.dateformat=yyyy-MM-dd HH:mm:ss.SSS,Asia/Kolkata
# JWT
jwt.secret=yasyuggyuesrutewtr7tt5654455454566

jwt.access-expiration=900000
jwt.refresh-expiration=604800000

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

